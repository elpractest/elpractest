# Practest SPA (app.practest.live) — security response headers.
#
# nginx gotcha: an `add_header` inside a `location` block DROPS every header
# inherited from the server block. So this snippet is `include`d in the server
# block AND in every location that sets its own add_header (the cache ones).
# Keep those includes in sync if you add locations.
#
# `always` = emit even on error responses (4xx/5xx), not just 2xx.

add_header X-Content-Type-Options    "nosniff"                          always;
add_header X-Frame-Options           "DENY"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP — REPORT-ONLY for now. It does NOT block anything yet; it only reports
# violations to the browser console. Watch the console through a full flow
# (login, a KaTeX question, a Razorpay checkout, GTM/analytics) and widen the
# allowlists for legitimate violations. Only once the console is clean, rename
# the header to `Content-Security-Policy` (drop `-Report-Only`) to enforce.
#
#   script-src : self + Razorpay checkout + Google Tag Manager + reCAPTCHA
#   style-src  : 'unsafe-inline' is REQUIRED — KaTeX output and GTM inject
#                inline style attributes; without it math rendering breaks.
#   connect-src: the API origin + analytics beacons + Razorpay telemetry
#   frame-src  : Razorpay checkout iframe + reCAPTCHA challenge
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://www.googletagmanager.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.practest.live https://lumberjack.razorpay.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
