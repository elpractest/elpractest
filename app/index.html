<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practest — Exam Prep</title>
    <meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1fa" media="(prefers-color-scheme: light)" />
    <!-- Theme boot: cookie (shared with the public site) → localStorage → dark, before first paint -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )practest_theme=(light|dark)/);
          var t = m ? m[1] : localStorage.getItem('practest-theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* private mode etc. — default dark stands */ }
      })();
    </script>
    <!-- Fonts: Space Grotesk (display) · Inter (UI) · JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <!-- GTM Script Loader gated by cookie consent -->
    <script>
      window.dataLayer = window.dataLayer || [];
      
      function getConsentCookie() {
        const value = "; " + document.cookie;
        const parts = value.split("; practest_consent=");
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      function loadGTM() {
        if (window.gtmInitialized) return;
        var gtmId = "%VITE_GTM_ID%";
        if (!gtmId || gtmId.startsWith('%')) return;
        window.gtmInitialized = true;

        (function(w,d,s,l,i){
          w[l]=w[l]||[];
          w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
          var f=d.getElementsByTagName(s)[0],
              j=d.createElement(s),
              dl=l!='dataLayer'?'&l='+l:'';
          j.async=true;
          j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
          f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',gtmId);
      }

      var consent = getConsentCookie();
      if (consent === 'accepted') {
        loadGTM();
      } else {
        window.addEventListener('practest-consent-granted', function() {
          loadGTM();
        });
      }
    </script>
  </head>
  <body>
    <!-- GTM noscript iframe: only active when VITE_GTM_ID is set in production -->
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
