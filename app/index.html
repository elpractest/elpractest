<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- The owner's mark, same artwork the header renders and the Android app
         plates — not a stand-in glyph. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mark-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/mark-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/mark-180-plated.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Learning Practest — Exam Prep</title>
    <meta name="theme-color" content="#0b0e18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f9" media="(prefers-color-scheme: light)" />
    <!-- Theme boot: cookie (shared with the public site) → localStorage → LIGHT, before first paint.
         Dark stays fully supported; it is simply no longer the default. -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )practest_theme=(light|dark)/);
          var t = m ? m[1] : localStorage.getItem('practest-theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* private mode etc. — the light default stands */ }
      })();
    </script>
    <!-- Fonts: Bricolage Grotesque (display) · Hanken Grotesk (UI) ·
         JetBrains Mono (numerals) · Noto Sans Devanagari (हिं) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    />
    <!-- GTM Script Loader gated by cookie consent -->
    <script>
      window.dataLayer = window.dataLayer || [];
      
      function getConsentCookie() {
        const value = "; " + document.cookie;
        const parts = value.split("; practest_consent=");
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      function loadGTM() {
        if (window.gtmInitialized) return;
        var gtmId = "%VITE_GTM_ID%";
        if (!gtmId || gtmId.startsWith('%')) return;
        window.gtmInitialized = true;

        (function(w,d,s,l,i){
          w[l]=w[l]||[];
          w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
          var f=d.getElementsByTagName(s)[0],
              j=d.createElement(s),
              dl=l!='dataLayer'?'&l='+l:'';
          j.async=true;
          j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
          f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',gtmId);
      }

      var consent = getConsentCookie();
      if (consent === 'accepted') {
        loadGTM();
      } else {
        window.addEventListener('practest-consent-granted', function() {
          loadGTM();
        });
      }
    </script>
  </head>
  <body>
    <!-- GTM noscript iframe: only active when VITE_GTM_ID is set in production -->
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
