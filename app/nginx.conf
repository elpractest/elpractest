# Practest SPA (app.practest.live) — static React bundle with history fallback.
# TLS is terminated upstream by Coolify's Traefik, so this server is plain :80.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # Security headers (see security-headers.conf). Re-included in each location
    # that sets its own add_header — nginx drops inherited headers there.
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA history fallback: every unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell, so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
