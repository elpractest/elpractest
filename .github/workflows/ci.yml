name: CI

# ---------------------------------------------------------------------------
# Deploy model: PROMOTION BRANCH. No deploy credential exists anywhere in CI.
#
#   push to `main` → api-tests → (only if green) this workflow fast-forwards
#   `deploy/coolify` to that exact commit → Coolify's GitHub App webhook sees
#   the branch move and rebuilds api/worker/app/web behind Traefik.
#
# So `main` is the trunk you push to, and **`deploy/coolify` is a release
# pointer that only this workflow moves**. The gate is structural: the branch
# Coolify watches cannot advance unless the tests passed, because nothing else
# advances it. Coolify's own auto-deploy stays ON — that is what makes the
# promotion take effect, and it is safe precisely because the branch is CI-owned.
#
# Why not have CI call Coolify's deploy API instead? That needs a Coolify API
# token in repo secrets. This needs no secret at all — the promotion push uses
# the automatic GITHUB_TOKEN. (The previous model did call that API, and its
# three COOLIFY_* secrets were never actually set, so the job logged "skipping"
# and exited green for months while Coolify's webhook did the real, UNGATED
# deploy. A skip-when-unconfigured branch in a deploy job hides exactly that, so
# this one has none: if the promotion cannot happen, the job goes red.)
#
# The promotion push is deliberately NOT --force. If `deploy/coolify` ever holds
# a commit `main` does not, GitHub rejects the push and this job fails loudly
# instead of discarding it. Fix that by merging it back into main, never by
# forcing.
#
# MariaDB 10.6 (NOT MySQL 8) matches production: migrations that pass on
# SQLite/MySQL can still fail on MariaDB (the ->after() gotcha), and this job is
# the gate that catches that.
#
# Coolify-side settings this model depends on:
#   1. The Coolify app's tracked git branch must stay `deploy/coolify` (it
#      builds its own configured branch, whatever triggered the deploy).
#   2. A direct push to `deploy/coolify` bypasses the gate entirely — protect
#      that branch so only this workflow can move it.
# ---------------------------------------------------------------------------

on:
  push:
    # deploy/coolify is listed so a direct (gate-bypassing) push still gets
    # tested and is visibly attributable. CI's own promotion push uses
    # GITHUB_TOKEN, which by design does not trigger a further workflow run.
    branches: [main, develop, deploy/coolify]
  pull_request:
    branches: [main, deploy/coolify]
  workflow_dispatch:

concurrency:
  # Never let two deploys interleave.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    name: Laravel API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: practest_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, bcmath, gd, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          # Paths are relative to the workspace root, not working-directory.
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Build .env.testing
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env.testing
          sed -i 's/# DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/# DB_PORT=3306/DB_PORT=3306/' .env.testing
          sed -i 's/# DB_DATABASE=practest/DB_DATABASE=practest_test/' .env.testing
          sed -i 's/# DB_USERNAME=root/DB_USERNAME=test/' .env.testing
          sed -i 's/# DB_PASSWORD=/DB_PASSWORD=test/' .env.testing
          # Run the suite as a real 'testing' environment. --env=testing makes this
          # file's APP_ENV win over phpunit.xml, and if it stays 'local' then
          # app()->environment('testing') is false, the SuperAdminSeeder seeds the
          # production VSN admin, and the super-admin/admin-count tests fail.
          sed -i 's/^APP_ENV=local/APP_ENV=testing/' .env.testing
          sed -i 's/SESSION_DOMAIN=.practest.live/SESSION_DOMAIN=null/' .env.testing
          # SANCTUM_STATEFUL_DOMAINS and FRONTEND_URL are left exactly as the example
          # ships them: the 2FA-gate test sends a localhost:3000 Referer and must be
          # treated as stateful (so the session — and the gate — actually engage), and
          # PhaseA0FixesTest asserts config('app.frontend_url') is exactly :3000.

      - name: Generate APP_KEY
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run tests
        run: php artisan test --env=testing

  promote:
    name: Promote main → deploy/coolify
    needs: [api-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      # The one privilege this workflow needs: move the release pointer.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: pushing a ref from a shallow clone can be refused with
          # "shallow update not allowed". checkout also persists GITHUB_TOKEN as
          # the credential, which is what authorises the push below.
          fetch-depth: 0

      - name: Fast-forward deploy/coolify to the tested commit
        run: |
          set -euo pipefail
          # Push the exact SHA the tests ran against — not "main", which could
          # have moved while the suite was running.
          echo "Promoting ${GITHUB_SHA} to deploy/coolify"
          git push origin "${GITHUB_SHA}:refs/heads/deploy/coolify"
          echo "Promoted. Coolify's webhook now rebuilds from deploy/coolify."
