name: CI

# ---------------------------------------------------------------------------
# Deploy model: COOLIFY (Docker). The old cPanel tarball-upload + SSH deploy is
# retired. On a green push to deploy/coolify (the deploy branch), this workflow
# asks Coolify to redeploy; the Coolify host builds the images from
# docker-compose.coolify.yml (api, worker, app, web) and rolls them out behind
# Traefik. api-tests remains the gate.
#
# MariaDB 10.6 (NOT MySQL 8) matches production: migrations that pass on
# SQLite/MySQL can still fail on MariaDB (the ->after() gotcha), and this job is
# the gate that catches that.
#
# Required repo secrets for the deploy job (set after the Coolify app exists):
#   COOLIFY_URL       base URL of the Coolify instance, no trailing slash
#   COOLIFY_TOKEN     a Coolify API token (sent as Bearer)
#   COOLIFY_APP_UUID  the Practest compose application's resource UUID
# Until those three are set the deploy step skips cleanly (green, not red).
#
# Two Coolify-side settings must also match this model:
#   1. The Coolify app's tracked git branch must be `deploy/coolify` (it builds
#      from its own configured branch, regardless of what triggered the deploy).
#   2. Coolify's own auto-deploy-on-push must stay OFF, so this test gate is the
#      only path to production.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [deploy/coolify, main, develop]
  pull_request:
    branches: [deploy/coolify, main]
  workflow_dispatch:

concurrency:
  # Never let two deploys interleave.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    name: Laravel API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: practest_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3, bcmath, gd, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          # Paths are relative to the workspace root, not working-directory.
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Build .env.testing
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env.testing
          sed -i 's/# DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/# DB_PORT=3306/DB_PORT=3306/' .env.testing
          sed -i 's/# DB_DATABASE=practest/DB_DATABASE=practest_test/' .env.testing
          sed -i 's/# DB_USERNAME=root/DB_USERNAME=test/' .env.testing
          sed -i 's/# DB_PASSWORD=/DB_PASSWORD=test/' .env.testing
          # Run the suite as a real 'testing' environment. --env=testing makes this
          # file's APP_ENV win over phpunit.xml, and if it stays 'local' then
          # app()->environment('testing') is false, the SuperAdminSeeder seeds the
          # production VSN admin, and the super-admin/admin-count tests fail.
          sed -i 's/^APP_ENV=local/APP_ENV=testing/' .env.testing
          sed -i 's/SESSION_DOMAIN=.practest.live/SESSION_DOMAIN=null/' .env.testing
          # SANCTUM_STATEFUL_DOMAINS and FRONTEND_URL are left exactly as the example
          # ships them: the 2FA-gate test sends a localhost:3000 Referer and must be
          # treated as stateful (so the session — and the gate — actually engage), and
          # PhaseA0FixesTest asserts config('app.frontend_url') is exactly :3000.

      - name: Generate APP_KEY
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run tests
        run: php artisan test --env=testing

  deploy:
    name: Trigger Coolify deploy
    needs: [api-tests]
    if: github.ref == 'refs/heads/deploy/coolify' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Ask Coolify to redeploy
        run: |
          set -euo pipefail
          # Skip cleanly (green) until the three secrets are configured, so this
          # job never red-Xs a push before auto-deploy is wired up.
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_TOKEN}" ] || [ -z "${COOLIFY_APP_UUID}" ]; then
            echo "Coolify secrets not set — skipping deploy trigger."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "Coolify responded: $code"
          cat /tmp/resp || true
          echo
          [ "$code" = "200" ] || { echo "::error::Coolify deploy trigger failed (HTTP $code)"; exit 1; }
