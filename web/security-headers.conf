# Practest marketing site (practest.live) — security response headers.
#
# nginx gotcha: an `add_header` inside a `location` block DROPS every inherited
# header. So this snippet is `include`d in the server block AND in the /_astro/
# cache location. Keep those includes in sync if you add locations.
#
# `always` = emit even on error responses (e.g. the 404 page).

add_header X-Content-Type-Options    "nosniff"                          always;
add_header X-Frame-Options           "DENY"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP — REPORT-ONLY for now (reports to console, blocks nothing). Static
# marketing site: self + Google Tag Manager / Analytics + the contact form's
# reCAPTCHA. Watch the console across the site + a contact submission, widen
# for legit violations, then rename to `Content-Security-Policy` to enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.practest.live https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
