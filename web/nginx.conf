# Practest marketing site (practest.live / www) — static Astro output.
# TLS is terminated upstream by Coolify's Traefik, so this server is plain :80.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Astro emits directory-style routes (/foo/index.html); serve those, else 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro's generated 404 page.
    error_page 404 /404.html;

    # Immutable hashed assets.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
