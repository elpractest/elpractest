name: practest_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_math_fork: ^0.7.4
  webview_flutter: ^4.14.1
  razorpay_flutter: ^1.4.5
  # Google Play Billing rail for the in-app store. Razorpay above stays for the
  # web / non-Play builds; digital goods on a Play build must go through this.
  in_app_purchase: ^3.2.0
  provider: ^6.1.5+1
  youtube_player_flutter: ^10.0.1
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  # Firebase Cloud Messaging (push notifications). firebase_core initialises
  # the SDK from google-services.json; firebase_messaging handles tokens +
  # foreground/background messages. See lib/push_service.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Brand. Byte-identical to what the web SPA serves (app/src/assets), so the
    # phone and the browser cannot drift apart. `practest-logo` is the full
    # lockup, for light surfaces only; the old `practest-logo-knockout` is gone
    # because the new wordmark is solid black and has nothing to knock out of —
    # on dark, the guide uses a plated mark beside live type instead. The mark
    # alone is resolution-aware because it is drawn small, in the header.
    - assets/brand/practest-logo.png
    # Dark-surface lockup: the owner's artwork with its black ink lifted to
    # #F3F6FF and navy to #8FB0FF (amber untouched), so BrandLockup can drop its
    # white plate on dark rather than boxing the mark.
    - assets/brand/practest-logo-dark.png
    - assets/brand/practest-mark.png
    - assets/brand/2.0x/practest-mark.png
    - assets/brand/3.0x/practest-mark.png

    # The welcome hero photograph. Ships without an image on purpose — the file
    # is an owner decision; WelcomeScreen falls back to the guide's radial ink
    # until assets/hero/welcome.jpg lands. See its README.
    - assets/hero/

    # Exam board marks, keyed by ExamBoard.key. Ships empty on purpose — the
    # marks are protected and adding them is a legal decision, not a design
    # one. Every surface that draws a board falls back to its initials, so the
    # folder being empty changes nothing but the artwork. See its README.
    - assets/boards/

  # Bundled, not inherited. Falling through to Roboto was the largest single
  # gap between this app and the web SPA that shares its palette. Each file is
  # one baked instance of the upstream variable font (Flutter resolves `weight`
  # per file, so pointing several weights at one variable file would silently
  # render the default instance for all of them), subset to Latin + the symbol
  # ranges the product actually uses — ₹ included.
  fonts:
    # Display: screen titles, the score figure and the wordmark. Sora replaced
    # Space Grotesk when the app moved onto the deep-ink + gold guide, which the
    # web SPA already implements (see app/src/index.css --font-display).
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    # Interface: everything the student reads. Replaced Inter, same reason.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Hindi. Bundled rather than left to the platform so हिं looks the same on
    # every OEM skin and matches the web. pubspec has no per-family fallback
    # mechanism, so this is wired through TextStyle.fontFamilyFallback in
    # theme.dart — see AppFont.fallback.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    # Figures: clocks and any number that must not reflow as it counts.
    # Monospaced by construction, so it needs no `tnum` feature.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
